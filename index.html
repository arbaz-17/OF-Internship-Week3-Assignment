<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Search and discover video games with GameBox."
    />

    <title>GameBox — Discover Games</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/styles.css" />
  </head>

  <body>
    <header class="app-header">
      <div class="container header-content">
        <p class="eyebrow">API Search Application Assignment</p>
        <h1>GameBox</h1>

        <p class="header-description">Find your next game.</p>
      </div>
    </header>

    <main class="container app-main">
      <section class="search-panel" aria-labelledby="search-heading">
        <h2 id="search-heading" class="visually-hidden">Search games</h2>

        <form id="search-form" class="search-form" role="search" novalidate>
          <label for="search-input" class="visually-hidden">
            Search games by title
          </label>

          <div class="search-controls">
            <input
              id="search-input"
              name="search"
              type="search"
              placeholder="Search games..."
              autocomplete="off"
              minlength="2"
              enterkeyhint="search"
              aria-controls="games-grid"
            />

            <button id="search-button" type="submit">Search</button>
          </div>
        </form>
      </section>

      <section
        id="status-region"
        class="status-region"
        aria-live="polite"
        aria-atomic="true"
      >
        <div id="initial-state" class="state-message">
          Start typing to discover games.
        </div>

        <div id="loading-state" class="state-message" role="status" hidden>
          Searching games...
        </div>

        <div id="error-state" class="state-message" role="alert" hidden>
          We could not load the games. Please try again.
        </div>

        <div id="empty-state" class="state-message" hidden>
          No matching games were found.
        </div>
      </section>

      <section
        id="results-section"
        class="results-section"
        aria-labelledby="results-heading"
        hidden
      >
        <div class="section-heading">
          <h2 id="results-heading">Games</h2>

          <p id="results-summary"></p>
        </div>

        <div id="games-grid" class="games-grid" aria-live="polite"></div>
      </section>

      <nav
        id="pagination"
        class="pagination"
        aria-label="Search result pages"
        hidden
      >
        <button id="previous-page" type="button" disabled>Previous</button>

        <p class="page-information">
          Page
          <span id="current-page">1</span>
          of
          <span id="total-pages">1</span>
        </p>

        <button id="next-page" type="button" disabled>Next</button>
      </nav>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
